name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Step 1: analyse commits and manage the release PR.
  release-please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name:        ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file:   release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge release PR
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" \
                --head "release-please--branches--main" \
                --state open --json number --jq '.[0].number')
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            echo "Cancelling Moodle Plugin CI on the release-please branch"
            for status in queued in_progress; do
              gh run list --repo "$GITHUB_REPOSITORY" \
                --branch release-please--branches--main \
                --workflow "Moodle Plugin CI" \
                --status "$status" \
                --json databaseId \
                --jq '.[].databaseId' | while read -r id; do
                  [ -n "$id" ] && gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
                done
            done
            echo "Merging release PR #$PR"
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge
          else
            echo "No open release PR found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 2: when the release PR is merged, build the ZIP and attach it.
  build-zip:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: courseradar

      - name: Bump Moodle plugin version (never go backwards)
        run: |
          CURRENT=$(grep -E '\$plugin->version' courseradar/version.php | grep -oE '[0-9]{10}' | head -1)
          TODAY00=$(date +%Y%m%d)00
          if [ -z "$CURRENT" ]; then
            NEW="$TODAY00"
          elif [ "$CURRENT" -ge "$TODAY00" ]; then
            NEW=$((CURRENT + 1))
          else
            NEW="$TODAY00"
          fi
          sed -i "s/\$plugin->version.*=.*;/\$plugin->version   = ${NEW};/" courseradar/version.php
          echo "Moodle \$plugin->version set to ${NEW} (was ${CURRENT:-none})"

      - name: Build installable ZIP
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ZIPNAME="report_courseradar-${TAG}.zip"
          zip -r "$ZIPNAME" courseradar \
            --exclude "courseradar/.git/*" \
            --exclude "courseradar/.github/*" \
            --exclude "courseradar/.gitignore" \
            --exclude "courseradar/.gitattributes" \
            --exclude "courseradar/CLAUDE.md" \
            --exclude "courseradar/CONTRIBUTING.md" \
            --exclude "courseradar/composer.json" \
            --exclude "courseradar/composer.lock" \
            --exclude "courseradar/phpcs.xml" \
            --exclude "courseradar/scripts/*" \
            --exclude "courseradar/release-please-config.json" \
            --exclude "courseradar/.release-please-manifest.json"

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: "*.zip"
